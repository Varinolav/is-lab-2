services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - is-lab-1-postgres-data:/var/lib/postgresql/data
    networks:
      - is-lab-1-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
      - "9990:9990"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - is-lab-1-network

volumes:
  is-lab-1-postgres-data:

networks:
  is-lab-1-network:
    driver: bridge
